name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact-path: |
              colink-desktop/src-tauri/target/release/bundle/nsis/*.exe
              colink-desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
              colink-desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          - os: ubuntu-24.04
            bundle: deb
            artifact-path: colink-desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Desktop
        uses: actions/checkout@v4
        with:
          path: colink-desktop

      - name: Checkout CastBoard
        uses: actions/checkout@v4
        with:
          repository: CoLinkDev/colink-castboard
          path: colink-castboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release
          workspaces: colink-desktop/src-tauri
          save-if: "false"

      - name: Install frontend dependencies
        working-directory: colink-desktop
        run: pnpm install

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Update version in tauri.conf.json
        working-directory: colink-desktop
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = "${{ steps.version.outputs.VERSION }}"
          $conf.bundle.active = $true
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Update version in Cargo.toml
        working-directory: colink-desktop
        shell: pwsh
        run: |
          $content = Get-Content src-tauri/Cargo.toml -Raw
          $content = $content -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"${{ steps.version.outputs.VERSION }}`""
          Set-Content src-tauri/Cargo.toml $content

      - name: Build Tauri app on Windows
        if: runner.os == 'Windows'
        working-directory: colink-desktop
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app on Linux
        if: runner.os == 'Linux'
        working-directory: colink-desktop
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-path }}
