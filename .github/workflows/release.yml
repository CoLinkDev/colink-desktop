name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Desktop
        uses: actions/checkout@v4
        with:
          path: colink-desktop

      - name: Checkout CastBoard
        uses: actions/checkout@v4
        with:
          repository: CoLinkDev/colink-castboard
          path: colink-castboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: colink-desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: colink-desktop
        run: pnpm install

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Update version in tauri.conf.json
        working-directory: colink-desktop
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = "${{ steps.version.outputs.VERSION }}"
          $conf.bundle.active = $true
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Update version in Cargo.toml
        working-directory: colink-desktop
        shell: pwsh
        run: |
          $content = Get-Content src-tauri/Cargo.toml -Raw
          $content = $content -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"${{ steps.version.outputs.VERSION }}`""
          Set-Content src-tauri/Cargo.toml $content

      - name: Build Tauri app
        working-directory: colink-desktop
        run: pnpm tauri build

      - name: Upload artifacts
        working-directory: colink-desktop
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/release/bundle"
          $artifacts = @()
          $artifacts += Get-ChildItem "$bundlePath/nsis/*.exe" -ErrorAction SilentlyContinue
          $artifacts += Get-ChildItem "$bundlePath/msi/*.msi" -ErrorAction SilentlyContinue
          echo "Found artifacts:"
          $artifacts | ForEach-Object { echo $_.FullName }
          echo "ARTIFACTS<<EOF" >> $env:GITHUB_OUTPUT
          $artifacts | ForEach-Object { echo $_.FullName >> $env:GITHUB_OUTPUT }
          echo "EOF" >> $env:GITHUB_OUTPUT
        id: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            colink-desktop/src-tauri/target/release/bundle/nsis/*.exe
            colink-desktop/src-tauri/target/release/bundle/msi/*.msi
