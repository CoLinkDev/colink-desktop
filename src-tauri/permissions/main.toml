[[permission]]
identifier = "allow-main-commands"
description = "Allows the main application window to invoke its application commands."
commands.allow = [
  "bootstrap_app",
  "login",
  "register_account",
  "logout",
  "get_saved_login",
  "save_saved_login",
  "clear_saved_login",
  "list_devices",
  "refresh_devices",
  "update_device_name",
  "delete_device",
  "forget_lan_trust",
  "rotate_device_key",
  "list_lan_pairing_candidates",
