[package]
name = "colink-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22.1"
aes-gcm = "0.10.3"
aes = "0.8.4"
blake3 = { version = "1.8.2", features = ["mmap", "rayon"] }
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
clipboard-rs = "0.3.4"
curve25519-dalek = "4.1.3"
dirs = "5.0.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
futures-util = "0.3.31"
fs2 = "0.4.3"
hkdf = "0.12.4"
hostname = "0.4.1"
if-addrs = "0.15.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }
keyring = { version = "3", features = ["windows-native"] }
mdns-sd = "0.20.3"
md5 = "0.8.0"
rand = "0.8.5"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15.4"
rusqlite = { version = "0.31.0", features = ["bundled"] }
rustls = { version = "0.23.40", features = ["ring"] }
sanitize-filename = "0.5.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
sha2 = "0.10.9"
sysinfo = "0.33.1"
sys-locale = "0.3.2"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.2"
thiserror = "1.0.64"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5.2"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
lru = "0.12"
musixmatch-inofficial = "0.4.1"
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2.10.1"
winreg = "0.55.0"
windows = { version = "0.61.3", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_MediaFoundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2.1.0"
